# One grouped PR per ecosystem per month, so updates don't pile up as branches.
# Security fixes still arrive as soon as an advisory is published, also grouped.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      dev-dependencies:
        patterns: ["*"]
      security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # Must match engines.vscode; bump both together by hand.
      - dependency-name: "@types/vscode"
      # typescript-eslint 8 requires typescript <6.1; unblock when it supports 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Node types follow the CI Node line (22), not the newest release.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
