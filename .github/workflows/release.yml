name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Runs third-party code (npm ci, tests): no write token, no publish secrets.
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check-types

      - name: Lint
        run: npm run lint

      # VS Code needs a display server to run the integration tests headlessly.
      - name: Test
        run: xvfb-run -a npm test

      - name: Package .vsix
        run: npm run package

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flutter-terminal-helper-vsix
          path: "*.vsix"

  # Only tags publish. Installs with --ignore-scripts so no dependency code runs
  # next to the credentials; only vsce/ovsx execute. Both registries use trusted
  # publishing (GitHub OIDC) registered for this file: no stored token.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x

      - name: Install publishing tools
        run: npm ci --ignore-scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flutter-terminal-helper-vsix

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: "*.vsix"
          generate_release_notes: true

      # Each registry publishes even if the other fails; --skip-duplicate makes
      # re-running a tag safe after a partial failure.
      - name: Publish to Open VSX
        if: ${{ !cancelled() }}
        run: npx ovsx publish *.vsix --trusted-publishing --skip-duplicate

      # VS Code itself only searches the Visual Studio Marketplace.
      - name: Publish to VS Code Marketplace
        if: ${{ !cancelled() }}
        run: npx @vscode/vsce publish --packagePath *.vsix --oidc --skip-duplicate
